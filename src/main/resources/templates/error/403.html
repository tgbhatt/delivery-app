<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(title='Access Denied')}">
</head>
<body class="diq-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F5F7;">

<div style="text-align:center;padding:2rem;max-width:420px;">

  <!-- Icon -->
  <div style="width:72px;height:72px;border-radius:20px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem;">
    🔒
  </div>

  <div style="font-size:clamp(3rem,10vw,5rem);font-weight:800;letter-spacing:-0.05em;
              background:linear-gradient(135deg,#DC2626,#991B1B);
              -webkit-background-clip:text;-webkit-text-fill-color:transparent;
              background-clip:text;line-height:1;margin-bottom:0.75rem;">
    403
  </div>

  <h1 style="font-size:1.5rem;font-weight:700;color:#1D1D1F;letter-spacing:-0.02em;margin-bottom:0.625rem;">
    Access denied
  </h1>
  <p style="font-size:0.9375rem;color:#6E6E73;margin-bottom:2rem;line-height:1.6;">
    You don't have permission to view this page. Please sign in with an account that has access.
  </p>

  <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
    <a href="javascript:history.back()" class="diq-btn diq-btn-secondary">
      <i class="bi bi-arrow-left"></i> Go back
    </a>
    <a th:href="@{/login}" class="diq-btn diq-btn-primary">
      <i class="bi bi-box-arrow-in-right"></i> Sign in
    </a>
  </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
