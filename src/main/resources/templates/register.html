<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(title='Create Account')}">
</head>
<body class="diq-page" style="background:#F5F5F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">

<div style="width:100%;max-width:480px;">

  <!-- Card -->
  <div class="diq-card" style="border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,.10);">
    <div class="diq-card-body" style="padding:2.5rem;">

      <!-- Header -->
      <div style="text-align:center;margin-bottom:2rem;">
        <div style="width:48px;height:48px;background:linear-gradient(135deg,#1E3A5F,#2563EB);border-radius:14px;display:flex;align-items:center;justify-content:center;color:white;font-size:1.375rem;margin:0 auto 1rem;">
          <i class="bi bi-truck"></i>
        </div>
        <h1 style="font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;color:#1D1D1F;margin-bottom:0.3rem;">Create your account</h1>
        <p style="font-size:0.9rem;color:#6E6E73;margin:0;">Join DeliverIQ and start tracking your deliveries</p>
      </div>

      <!-- Server-side error -->
      <div th:if="${errorMessage}" class="diq-alert diq-alert-error mb-4" data-auto-dismiss="6000">
        <i class="bi bi-x-circle-fill alert-icon"></i>
        <span th:text="${errorMessage}">Error</span>
        <button class="alert-close" type="button"><i class="bi bi-x"></i></button>
      </div>

      <!-- Form -->
      <form id="registerForm" th:action="@{/register}" method="post"
            style="display:flex;flex-direction:column;gap:1.125rem;">

        <!-- Full Name -->
        <div class="diq-form-group">
          <label for="name" class="diq-label">Full name <span class="required">*</span></label>
          <div class="diq-input-wrap">
            <i class="bi bi-person input-icon"></i>
            <input id="name" name="name" type="text"
                   class="diq-input" placeholder="Jane Smith"
                   autocomplete="name" required />
          </div>
          <span class="diq-form-error" id="name-error"></span>
        </div>

        <!-- Email -->
        <div class="diq-form-group">
          <label for="email" class="diq-label">Email address <span class="required">*</span></label>
          <div class="diq-input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input id="email" name="email" type="email"
                   class="diq-input" placeholder="you@example.com"
                   autocomplete="email" required />
          </div>
          <span class="diq-form-error" id="email-error"></span>
        </div>

        <!-- Phone (optional) -->
        <div class="diq-form-group">
          <label for="phone" class="diq-label">
            Phone number
            <span style="font-size:0.75rem;font-weight:400;color:#6E6E73;margin-left:4px;">(optional)</span>
          </label>
          <div class="diq-input-wrap">
            <i class="bi bi-telephone input-icon"></i>
            <input id="phone" name="phone" type="tel"
                   class="diq-input" placeholder="10-digit mobile number"
                   autocomplete="tel" />
          </div>
          <span class="diq-form-error" id="phone-error"></span>
        </div>

        <!-- Divider -->
        <div class="diq-divider" style="margin:0.25rem 0;"></div>

        <!-- Password -->
        <div class="diq-form-group">
          <label for="password" class="diq-label">Password <span class="required">*</span></label>
          <div class="diq-input-wrap">
            <i class="bi bi-lock input-icon"></i>
            <input id="password" name="password" type="password"
                   class="diq-input has-action" placeholder="Min. 6 characters"
                   autocomplete="new-password" required />
            <button type="button" class="input-action" onclick="togglePassword(this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <span class="diq-form-error" id="password-error"></span>
        </div>

        <!-- Confirm Password -->
        <div class="diq-form-group">
          <label for="confirmPassword" class="diq-label">Confirm password <span class="required">*</span></label>
          <div class="diq-input-wrap">
            <i class="bi bi-lock-fill input-icon"></i>
            <input id="confirmPassword" name="confirmPassword" type="password"
                   class="diq-input has-action" placeholder="Repeat your password"
                   autocomplete="new-password" required />
            <button type="button" class="input-action" onclick="togglePassword(this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <span class="diq-form-error" id="confirmPassword-error"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="diq-btn diq-btn-primary diq-btn-lg diq-btn-full" style="margin-top:0.375rem;">
          <i class="bi bi-person-plus"></i>
          Create account
        </button>

      </form>

      <!-- Login link -->
      <p style="margin-top:1.5rem;text-align:center;font-size:0.9rem;color:#6E6E73;">
        Already have an account?
        <a th:href="@{/login}" style="color:#2563EB;font-weight:600;text-decoration:none;">Sign in</a>
      </p>

    </div>
  </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
