<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ══════════════════════════════════════════════════════════
     Fragment: head
     Usage: <head th:replace="~{fragments/layout :: head(title='Page Title')}">
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' — DeliverIQ'">DeliverIQ</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

  <!-- Bootstrap 5 (grid + utilities only — we override its components) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- DeliverIQ Design System -->
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</th:block>


<!-- ══════════════════════════════════════════════════════════
     Fragment: navbar
     Usage: <nav th:replace="~{fragments/layout :: navbar}">
     Reads: loggedInUser from HttpSession (set by LoginController)
     ══════════════════════════════════════════════════════════ -->
<nav th:fragment="navbar" class="diq-navbar">
  <div class="diq-navbar-content">

    <!-- Brand -->
    <a th:href="@{'/'}" class="diq-navbar-brand">
      <div class="brand-icon">
        <i class="bi bi-truck"></i>
      </div>
      DeliverIQ
    </a>

    <!-- Role-aware nav links -->
    <ul class="diq-navbar-nav ms-4"
        th:if="${session.loggedInUser != null}">

      <!-- CUSTOMER links -->
      <th:block th:if="${session.loggedInUser.role.name() == 'CUSTOMER'}">
        <li>
          <a th:href="@{/customer/orders}" class="nav-link">
            <i class="bi bi-box-seam me-1"></i>My Orders
          </a>
        </li>
        <li>
          <a th:href="@{/customer/book}" class="nav-link">
            <i class="bi bi-plus-circle me-1"></i>Book Delivery
          </a>
        </li>
      </th:block>

      <!-- AGENT links -->
      <th:block th:if="${session.loggedInUser.role.name() == 'AGENT'}">
        <li>
          <a th:href="@{/agent/dashboard}" class="nav-link">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
      </th:block>

      <!-- ADMIN links -->
      <th:block th:if="${session.loggedInUser.role.name() == 'ADMIN'}">
        <li>
          <a th:href="@{/admin/dashboard}" class="nav-link">
            <i class="bi bi-grid-3x3-gap me-1"></i>Dashboard
          </a>
        </li>
      </th:block>

    </ul>

    <!-- Right side: user chip + logout -->
    <div class="diq-navbar-user ms-auto"
         th:if="${session.loggedInUser != null}">

      <div class="user-chip">
        <div class="avatar"
             th:text="${#strings.toUpperCase(#strings.substring(session.loggedInUser.name,0,1))}">
          U
        </div>
        <span th:text="${session.loggedInUser.name}">User</span>
        <span class="text-muted" style="font-weight:400; opacity:0.7;"
              th:text="'· ' + ${session.loggedInUser.role.name()}">· ROLE</span>
      </div>

      <a th:href="@{/logout}" class="diq-btn diq-btn-secondary diq-btn-sm">
        <i class="bi bi-box-arrow-right"></i>
        Sign out
      </a>
    </div>

    <!-- Not logged in -->
    <div class="ms-auto" th:if="${session.loggedInUser == null}">
      <a th:href="@{/login}" class="diq-btn diq-btn-primary diq-btn-sm">Sign in</a>
    </div>

  </div>
</nav>


<!-- ══════════════════════════════════════════════════════════
     Fragment: scripts
     Usage: place at end of <body>
            <div th:replace="~{fragments/layout :: scripts}"></div>
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="scripts">
  <!-- Bootstrap JS (for collapse, dropdowns) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DeliverIQ interactions -->
  <script th:src="@{/js/app.js}"></script>
  <!-- Toast container -->
  <div id="diq-toast-container"></div>
</th:block>


<!-- ══════════════════════════════════════════════════════════
     Fragment: flash-messages
     Usage: <div th:replace="~{fragments/layout :: flash(successMessage=${successMessage}, errorMessage=${errorMessage})}">
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="flash(successMessage, errorMessage)">
  <div th:if="${successMessage}" class="diq-alert diq-alert-success mb-3" data-auto-dismiss="5000">
    <i class="bi bi-check-circle-fill alert-icon"></i>
    <span th:text="${successMessage}">Success</span>
    <button class="alert-close" type="button"><i class="bi bi-x"></i></button>
  </div>
  <div th:if="${errorMessage}" class="diq-alert diq-alert-error mb-3" data-auto-dismiss="6000">
    <i class="bi bi-x-circle-fill alert-icon"></i>
    <span th:text="${errorMessage}">Error</span>
    <button class="alert-close" type="button"><i class="bi bi-x"></i></button>
  </div>
</th:block>

</body>
</html>
