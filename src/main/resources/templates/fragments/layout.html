<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ══════════════════════════════════════════════════════════
     Fragment: head
     Usage: <head th:replace="~{fragments/layout :: head(title='Page Title')}">
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' — DeliverIQ'">DeliverIQ</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />

  <!-- Bootstrap 5 (grid + utilities only) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- DeliverIQ Design System (v2 — cache bust) -->
  <link rel="stylesheet" th:href="@{/css/app.css(v=2)}" />
</th:block>


<!-- ══════════════════════════════════════════════════════════
     Fragment: navbar  (renders the sidebar)
     Usage: <nav th:replace="~{fragments/layout :: navbar}">
     Reads: loggedInUser from HttpSession (set by LoginController)
     ══════════════════════════════════════════════════════════ -->
<aside th:fragment="navbar" class="diq-sidebar">

  <!-- Logo -->
  <a th:href="@{'/'}" class="sb-logo">
    <div class="logo-icon">
      <i class="bi bi-truck"></i>
    </div>
    <span>DeliverIQ</span>
  </a>

  <!-- Role-aware nav links -->
  <nav class="sb-nav" th:if="${session.loggedInUser != null}">

    <!-- CUSTOMER links -->
    <th:block th:if="${session.loggedInUser.role.name() == 'CUSTOMER'}">
      <span class="sb-nav-label">Customer</span>
      <a th:href="@{/customer/orders}" class="sb-nav-item">
        <i class="bi bi-box-seam"></i>
        <span>My Orders</span>
      </a>
      <a th:href="@{/customer/past-orders}" class="sb-nav-item">
        <i class="bi bi-clock-history"></i>
        <span>Past Orders</span>
      </a>
      <a th:href="@{/customer/recurring}" class="sb-nav-item">
        <i class="bi bi-arrow-repeat"></i>
        <span>Recurring</span>
      </a>
      <a th:href="@{/customer/book}" class="sb-nav-item">
        <i class="bi bi-plus-circle"></i>
        <span>New Delivery</span>
      </a>
    </th:block>

    <!-- AGENT links -->
    <th:block th:if="${session.loggedInUser.role.name() == 'AGENT'}">
      <span class="sb-nav-label">Agent</span>
      <a th:href="@{/agent/dashboard}" class="sb-nav-item">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
      </a>
    </th:block>

    <!-- ADMIN links -->
    <th:block th:if="${session.loggedInUser.role.name() == 'ADMIN'}">
      <span class="sb-nav-label">Admin</span>
      <a th:href="@{/admin/dashboard}" class="sb-nav-item">
        <i class="bi bi-grid-3x3-gap"></i>
        <span>Dashboard</span>
      </a>
      <a th:href="@{/admin/agents}" class="sb-nav-item">
        <i class="bi bi-people"></i>
        <span>Agents</span>
      </a>
    </th:block>

  </nav>

  <!-- Not logged in: just spacer -->
  <div th:if="${session.loggedInUser == null}" style="flex:1;"></div>

  <!-- Sidebar footer: user chip + logout -->
  <div class="sb-footer" th:if="${session.loggedInUser != null}">
    <div class="sb-avatar"
         th:text="${#strings.toUpperCase(#strings.substring(session.loggedInUser.name,0,1))}">U</div>
    <div class="sb-user-info">
      <div class="sb-user-name" th:text="${session.loggedInUser.name}">User</div>
      <div class="sb-user-role" th:text="${session.loggedInUser.role.name()}">ROLE</div>
    </div>
    <a th:href="@{/logout}" class="sb-logout" title="Sign out">
      <i class="bi bi-box-arrow-right"></i>
    </a>
  </div>

  <!-- Not logged in footer -->
  <div class="sb-footer" th:if="${session.loggedInUser == null}">
    <a th:href="@{/login}" class="diq-btn diq-btn-primary diq-btn-sm" style="width:100%;">Sign in</a>
  </div>

</aside>


<!-- ══════════════════════════════════════════════════════════
     Fragment: topbar(title)
     Usage: <header th:replace="~{fragments/layout :: topbar(title='My Orders')}"></header>
     ══════════════════════════════════════════════════════════ -->
<header th:fragment="topbar(title)" class="diq-topbar">
  <span class="diq-topbar-title" th:text="${title}">Page Title</span>
  <div class="diq-topbar-actions">
    <!-- slot for page-level actions; child templates add their own buttons above topbar -->
  </div>
</header>


<!-- ══════════════════════════════════════════════════════════
     Fragment: scripts
     Usage: place at end of <body>
            <div th:replace="~{fragments/layout :: scripts}"></div>
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="scripts">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DeliverIQ interactions -->
  <script th:src="@{/js/app.js}"></script>
  <!-- Toast container -->
  <div id="diq-toast-container"></div>
</th:block>


<!-- ══════════════════════════════════════════════════════════
     Fragment: flash-messages
     Usage: <div th:replace="~{fragments/layout :: flash(successMessage=${successMessage}, errorMessage=${errorMessage})}">
     ══════════════════════════════════════════════════════════ -->
<th:block th:fragment="flash(successMessage, errorMessage)">
  <div th:if="${successMessage}" class="diq-alert diq-alert-success mb-3" data-auto-dismiss="5000">
    <i class="bi bi-check-circle-fill alert-icon"></i>
    <span th:text="${successMessage}">Success</span>
    <button class="alert-close" type="button"><i class="bi bi-x"></i></button>
  </div>
  <div th:if="${errorMessage}" class="diq-alert diq-alert-error mb-3" data-auto-dismiss="6000">
    <i class="bi bi-x-circle-fill alert-icon"></i>
    <span th:text="${errorMessage}">Error</span>
    <button class="alert-close" type="button"><i class="bi bi-x"></i></button>
  </div>
</th:block>

</body>
</html>
