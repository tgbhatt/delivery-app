<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(title='My Orders')}">
</head>
<body class="diq-page diq-body-offset" style="padding-bottom:3rem;">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="diq-container">

  <!-- Flash messages -->
  <div th:replace="~{fragments/layout :: flash(successMessage=${successMessage}, errorMessage=${errorMessage})}"></div>

  <!-- ── Page Header ──────────────────────────────────────── -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
    <div>
      <p class="diq-label" style="margin-bottom:0.25rem;">Customer Portal</p>
      <h1 style="font-size:1.625rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:0.25rem;">My Orders</h1>
      <p style="font-size:0.9rem;color:#6E6E73;margin:0;">Track and manage all your deliveries in one place.</p>
    </div>
    <a th:href="@{/customer/book}" class="diq-btn diq-btn-primary">
      <i class="bi bi-plus-circle"></i>
      New Delivery
    </a>
  </div>

  <!-- ── Empty State ───────────────────────────────────────── -->
  <div th:if="${orders == null or orders.isEmpty()}" class="diq-card">
    <div class="diq-empty" style="padding:4rem 2rem;">
      <div class="empty-icon"><i class="bi bi-box-seam"></i></div>
      <p class="empty-title">No orders yet</p>
      <p class="empty-desc">Book your first delivery and it will appear here.</p>
      <a th:href="@{/customer/book}" class="diq-btn diq-btn-primary" style="margin-top:0.5rem;">
        <i class="bi bi-plus-circle"></i>
        Book a delivery
      </a>
    </div>
  </div>

  <!-- ── Order Grid ─────────────────────────────────────────── -->
  <div th:unless="${orders == null or orders.isEmpty()}"
       style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem;">

    <div th:each="order : ${orders}" class="diq-order-card diq-card-hover">

      <!-- Card top -->
      <div class="order-header">
        <div>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.375rem;">
            <span class="order-id" th:text="'#' + ${order.id}">#ID</span>
            <span th:if="${order.isImmediate}" class="diq-badge diq-badge-immediate">
              <i class="bi bi-lightning-charge-fill"></i> Immediate
            </span>
            <span th:unless="${order.isImmediate}" class="diq-badge diq-badge-scheduled">
              <i class="bi bi-calendar-check"></i> Scheduled
            </span>
          </div>
          <span class="diq-badge"
                th:classappend="'diq-badge-' + ${order.currentStatus.name()}"
                th:text="${order.currentStatus.name().replace('_',' ')}">STATUS</span>
        </div>
        <span class="diq-badge"
              th:classappend="'diq-badge-priority-' + ${order.priority.name()}"
              th:text="${order.priority.name()}">PRIORITY</span>
      </div>

      <!-- Route -->
      <div class="order-route">
        <div class="route-item">
          <div class="route-dot route-dot-from"></div>
          <div>
            <p style="font-size:0.7rem;font-weight:600;color:#6E6E73;margin-bottom:0.1rem;">FROM</p>
            <p style="font-size:0.8125rem;color:#1D1D1F;margin:0;" th:text="${order.pickupAddress}">Pickup</p>
          </div>
        </div>
        <div class="route-line" style="margin-left:3.5px;"></div>
        <div class="route-item">
          <div class="route-dot route-dot-to"></div>
          <div>
            <p style="font-size:0.7rem;font-weight:600;color:#6E6E73;margin-bottom:0.1rem;">TO</p>
            <p style="font-size:0.8125rem;color:#1D1D1F;margin:0;" th:text="${order.deliveryAddress}">Delivery</p>
          </div>
        </div>
      </div>

      <!-- Slot info (scheduled only) -->
      <div th:if="${order.timeSlot != null}"
           style="display:flex;align-items:center;gap:0.5rem;background:#F0FDF4;border:1px solid rgba(22,163,74,.2);border-radius:8px;padding:0.5rem 0.75rem;margin-bottom:0.625rem;font-size:0.8125rem;color:#15803D;">
        <i class="bi bi-clock"></i>
        <span th:text="${#temporals.format(order.timeSlot.date,'dd MMM yyyy')} + ' · ' + ${order.timeSlot.startTime} + ' – ' + ${order.timeSlot.endTime}">Slot</span>
      </div>

      <!-- Package description -->
      <div style="font-size:0.8125rem;color:#6E6E73;margin-bottom:0.875rem;">
        <i class="bi bi-box-seam me-1"></i>
        <span th:text="${order.packageDescription}">Package</span>
      </div>

      <!-- Footer -->
      <div class="order-footer">
        <div th:if="${order.agent != null}"
             style="display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;color:#6E6E73;">
          <div style="width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#1E3A5F,#2563EB);color:white;font-size:0.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;"
               th:text="${#strings.toUpperCase(#strings.substring(order.agent.user.name,0,1))}">A</div>
          <span th:text="${order.agent.user.name}">Agent</span>
        </div>
        <div th:unless="${order.agent != null}"
             style="font-size:0.8rem;color:#AEAEB2;">
          <i class="bi bi-person-dash me-1"></i>Unassigned
        </div>

        <a th:href="@{'/track/' + ${order.id}}" class="diq-btn diq-btn-primary diq-btn-sm">
          <i class="bi bi-map"></i> Track
        </a>
      </div>

    </div>
  </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
